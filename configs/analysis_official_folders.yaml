# Official-folder map + study definition for the analysis pipeline
# (vdanalysis/). Relative paths are relative to THIS file's directory.
#
# Every rule from DEVIATIONS.md that decides "which data counts" lives here,
# not in code. Edit this file, not the Python, if a folder name changes.

results_root: ../results_v2        # where D, F1..F6, F11, R... runs live
rescored_root: ../rescored         # where scripts/rescore_f7/f8/f10 write (NOT results*/)
expected_records_per_run: 900      # 100 tasks x 3 conditions x 3 trials
# Stress diff = equal-weight average of the per-condition paired diffs (confirmed 2026-10-08).
stress_conditions: [schema_drift, fault_reporting]
baseline_condition: baseline
gate: {threshold: 0.05, reps: 10000, seed: 1234}   # PLAN.md sections 4 and 8
ceiling_threshold: 0.97            # PLAN.md section 7.6
truncation_limit: 0.02             # PLAN.md section 7.1

suites: [synthetic, bfcl_simple, bfcl_multiple]
task_data:                         # used only by the F7/F8 rescore scripts
  synthetic: ../data/base_tasks.jsonl
  bfcl_simple: ../data/bfcl_tasks.jsonl
  bfcl_multiple: ../data/bfcl_multiple_tasks.jsonl

# ---- models and pairs (PLAN.md section 2) ----
models:
  mistral_v01: {family: mistral, split: design}
  mistral_v02: {family: mistral, split: design}
  mistral_v03: {family: mistral, split: design}
  qwen2:       {family: qwen,    split: design}
  qwen25:      {family: qwen,    split: design}
  qwen3:       {family: qwen,    split: design}
  llama3:      {family: llama,   split: held-out}
  llama31:     {family: llama,   split: held-out}
  phi3_mini:   {family: phi,     split: held-out}
  phi35_mini:  {family: phi,     split: held-out}
  phi4_mini:   {family: phi,     split: held-out}
  granite30:   {family: granite, split: held-out}
  granite31:   {family: granite, split: held-out}
  granite32:   {family: granite, split: held-out}
  gemma2_2b:   {family: gemma,   split: held-out}
  gemma3_4b:   {family: gemma,   split: held-out}

pairs:
  - {old: mistral_v01, new: mistral_v02, family: mistral, split: design}
  - {old: mistral_v02, new: mistral_v03, family: mistral, split: design}
  - {old: qwen2,  new: qwen25, family: qwen, split: design}
  - {old: qwen25, new: qwen3,  family: qwen, split: design, size_changing: true}
  - {old: llama3, new: llama31, family: llama, split: held-out}
  - {old: phi3_mini,  new: phi35_mini, family: phi, split: held-out}
  - {old: phi35_mini, new: phi4_mini,  family: phi, split: held-out}
  - {old: granite30, new: granite31, family: granite, split: held-out}
  - {old: granite31, new: granite32, family: granite, split: held-out}
  - {old: gemma2_2b, new: gemma3_4b, family: gemma, split: held-out, size_changing: true}

# DEVIATIONS.md F6: the 6 models whose sampling actually changed. Main F6
# numbers use only pairs touching one of these; all pairs are also reported.
sampling_changed_models: [qwen2, qwen25, qwen3, llama3, llama31, gemma3_4b]

# ---- protocols -> folders ----
# Run layout: <results_root>/<folder>/<model>/<suite>/<run_id>/parsed_results.jsonl
base_protocol: D
protocols:
  D:  {folder: D,  expect_manifest: {F1_max_tokens: 256}}
  F1: {folder: F1, expect_manifest: {F1_max_tokens: 1024}}
  F2: {folder: F2, models: [qwen3], expect_manifest: {F2_thinking: "off"}}
  # F3 ran only on the 8 models that have a native tool template.
  F3: {folder: F3, expect_manifest: {F3_prompt_format: native},
       models: [llama31, qwen25, mistral_v03, granite30, granite31, granite32, qwen3, phi4_mini]}
  # DEVIATIONS.md F4: generic JSON only (full_schema was cut). Qwen3 gets
  # grammar AND blocked thinking -> labeled, reported separately.
  F4_json:
    folder: F4_json
    expect_manifest: {F4_constrained_decoding: generic_json}
    confounded_models: {qwen3: grammar+thinking_blocked}
  F5: {folder: F5}                       # Q8_0: 8B models from Kaggle, small models from the laptop, same folder
  # Kaggle hardware check: the D config + the laptop's Q4_K_M files, re-run on 2x T4 (llama3, llama31).
  # Never a decision protocol: only read by vdanalysis/hwcheck.py (see the hardware_check block).
  KAGGLE_HWCHECK: {folder: KAGGLE_HWCHECK, models: [llama3, llama31], control_only: true,
                   expect_manifest: {F1_max_tokens: 256}}
  F6: {folder: F6, expect_manifest: {F6_sampling_preset: recommended}}
  F11: {folder: F11, models: [mistral_v01, mistral_v02, mistral_v03, qwen2, qwen25, qwen3],
        expect_manifest: {F11_chat_wrapping: legacy}}
  # rescore-only factors: written by scripts/rescore_f7|f8|f10 into rescored_root
  F7:  {folder: F7,  root: rescored}
  F8:  {folder: F8,  root: rescored}
  F10: {folder: F10, root: rescored, expected_records: 300}
  # robust protocol R and its nuisance variants (folder names assumed; edit)
  R:       {folder: R,       confounded_models: {qwen3: grammar+thinking_blocked}}
  # 2026-10-15: R_F3/R_F6 are held-out-only (DEVIATIONS.md, 2026-10-12) --
  # every held-out model resolves to something (a real run or an override
  # to R), but no design model (mistral_v*/qwen*) was ever run or mapped
  # under either factor. Without this models: list, Store.applies() reads
  # the absent key as "applies to everyone" and tries to read design
  # models' data directly from a folder that was never populated for
  # them, instead of falling back to D (engine.py's documented, already-
  # working mechanism for a protocol that doesn't cover every model, e.g.
  # F2's Qwen3-only scope). This list is config only; no scoring/gate code
  # changed.
  R_F3:    {folder: R_F3,    confounded_models: {qwen3: grammar+thinking_blocked},
            models: [llama3, llama31, phi3_mini, phi35_mini, phi4_mini,
                     granite30, granite31, granite32, gemma2_2b, gemma3_4b]}
  # 2026-10-15: R_F5 is ALSO held-out-only (5 small models locally +
  # 5 held-out 8B models on Kaggle = these same 10 held-out models; F5
  # itself, unlike its R_ variant, genuinely runs on all 16 and keeps no
  # models: restriction). Same fix/reasoning as R_F3/R_F6 above.
  R_F5:    {folder: R_F5,    confounded_models: {qwen3: grammar+thinking_blocked},
            models: [llama3, llama31, phi3_mini, phi35_mini, phi4_mini,
                     granite30, granite31, granite32, gemma2_2b, gemma3_4b]}
  R_F6:    {folder: R_F6,    confounded_models: {qwen3: grammar+thinking_blocked},
            models: [llama3, llama31, phi3_mini, phi35_mini, phi4_mini,
                     granite30, granite31, granite32, gemma2_2b, gemma3_4b]}
  # 2026-10-09: R_unconstrained == F1 exactly (D + max_tokens=1024, no
  # constrained decoding, nothing else differs -- confirmed field-by-field
  # against the real F1 config, not assumed). Reuses F1's folder instead of
  # a separate run. See DEVIATIONS.md.
  R_unconstrained: {folder: F1, control_only: true}
  # controls (PLAN.md section 6); only the listed models need runs
  R_AA:           {folder: R_AA,           control_only: true}
  R_PC_Q2K:       {folder: R_PC_Q2K,       control_only: true}
  R_PC_NODESC:    {folder: R_PC_NODESC,    control_only: true}

# DEVIATIONS.md 2026-10-07: which folder is official for a (protocol, model).
overrides:
  - protocol: F3
    model: granite30
    folder: F3_rerun           # results_v2/F3_rerun/granite30/ (after the parser fix)
  - protocol: F3
    model: phi4_mini
    folder: F3                 # same folder as every other F3 model, but the records were
                               # RESCORED IN PLACE on 2026-10-07 (parsed_results.jsonl +
                               # summary.json); this is the rescored version.
    rescored_in_place: true
  # 2026-10-12: R_F6 only ran on the held-out models whose sampling
  # actually changes (llama3, llama31, gemma3_4b); every other held-out
  # model's R_F6 config is identical to R (no recommendation to apply),
  # so they map to R's folder instead of a separate run.
  - {protocol: R_F6, model: phi3_mini,  folder: R}
  - {protocol: R_F6, model: phi35_mini, folder: R}
  - {protocol: R_F6, model: phi4_mini,  folder: R}
  - {protocol: R_F6, model: granite30,  folder: R}
  - {protocol: R_F6, model: granite31,  folder: R}
  - {protocol: R_F6, model: granite32,  folder: R}
  - {protocol: R_F6, model: gemma2_2b,  folder: R}
  # 2026-10-12: R_F3 only ran on the held-out models with a real native
  # tool template (llama31, phi4_mini, granite30/31/32); every other
  # held-out model has no native template to switch to, so its R_F3
  # config is identical to R (prompt_format can only be "shared"), and
  # maps to R's folder instead of a separate run.
  - {protocol: R_F3, model: llama3,     folder: R}
  - {protocol: R_F3, model: phi3_mini,  folder: R}
  - {protocol: R_F3, model: phi35_mini, folder: R}
  - {protocol: R_F3, model: gemma2_2b,  folder: R}
  - {protocol: R_F3, model: gemma3_4b,  folder: R}
audit_only_folders:
  - F3/granite30               # pre-fix original, kept for audit only; the loader refuses it

# ---- factors (PLAN.md section 5). kind: run = own protocol; gate = same data, CI gate ----
factors:
  F1:  {protocol: F1, level: "max_tokens=1024"}
  F2:  {protocol: F2, level: "thinking off (Qwen3 only)"}
  F3:  {protocol: F3, level: "native tool template", main_min_changed: 2}   # main = both models have a native template
  F4:  {protocol: F4_json, level: "generic JSON grammar"}
  F5:  {protocol: F5, level: "Q8_0"}
  F6:  {protocol: F6, level: "recommended sampling", main_min_changed: 1, changed_models: [qwen2, qwen25, qwen3, llama3, llama31, gemma3_4b]}
  F7:  {protocol: F7, level: "lenient parsing (escape repair)"}
  F8:  {protocol: F8, level: "relaxed intent (5 causes)"}
  F9:  {kind: gate, level: "CI gate"}
  F10: {protocol: F10, level: "1 trial (greedy only)"}
  F11: {protocol: F11, level: "legacy chat wrapping (exploratory, Mistral/Qwen only)"}

factor_groups:
  h1: [F1, F2, F3, F4, F5, F6, F7, F8, F9, F10]     # H1 factor set (F11 excluded)
  format: [F1, F2, F4, F7]                           # H2
  other: [F3, F5, F6, F8]                            # H2
  nuisance: [F3, F5, F6]                             # H4

# ---- Kaggle hardware check (DEVIATIONS draft: F5/R_F5 on Kaggle T4) ----
# hardware_diff = pair stress diff on Kaggle minus the same on the laptop (vdanalysis/hwcheck.py).
hardware_check:
  pair: {old: llama3, new: llama31}
  laptop_protocol: D
  kaggle_protocol: KAGGLE_HWCHECK
  tolerance: 0.03          # per run: |greedy score diff| and |parse rate diff| must both be <= this

# ---- robust protocol R (PLAN.md section 7) ----
robust:
  base: R
  nuisance: {F3: R_F3, F5: R_F5, F6: R_F6}
  unconstrained: R_unconstrained

# DEVIATIONS.md F4: Qwen3 F4 vs F2 comparison
qwen3_study: {model: qwen3, thinking_off: F2, grammar: F4_json, label: grammar+thinking_blocked}

# ---- controls (PLAN.md section 6), model lists as decided by the user ----
# A/A: 3 design (mistral_v02, qwen2, qwen25) + 3 held-out (llama31, phi35_mini, granite31), per PLAN.md section 6.
# Positive controls: run under both damage types.
controls:
  - {name: AA_R, kind: aa, protocol_a: R, protocol_b: R_AA, gate: ci, h5: true,
     models: [mistral_v02, qwen2, qwen25, llama31, phi35_mini, granite31]}
  - {name: PC_Q2K_R, kind: pc, protocol_a: R, protocol_b: R_PC_Q2K, gate: ci, h5: true,
     models: [mistral_v03, qwen25, llama31, granite32]}
  - {name: PC_NODESC_R, kind: pc, protocol_a: R, protocol_b: R_PC_NODESC, gate: ci, h5: true,
     models: [mistral_v03, qwen25, llama31, granite32]}
