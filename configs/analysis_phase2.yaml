# Phase 2 analysis config (PLAN_PHASE2.md). Extends the official Phase 1 config.
#
# LAYOUT ASSUMPTION (the plan does not fix where results_v3 puts things): results_v3 mirrors
# results_v2, <root>/<folder>/<model>/<suite>/<run_id>/parsed_results.jsonl (+ raw_outputs.jsonl),
# using the folder names below. Change `folder:` / `roots:` here if the runs are written elsewhere.
# Nothing else in the code depends on it.
extends: analysis_official_folders.yaml

_templates:
  # Laptop W1 run = Phase 1's trials 0-2 (results_v2) + the new trials 3-9 (results_v3, seeds 1237-1243).
  laptop_w1: &laptop_w1
    - {root: results_root, trial_offset: 0}
    - {root: v3, trial_offset: 3, overrides: false}
  # Same for the scoring-only factors, read from the rescored trees (no raw outputs there).
  rescored_w1: &rescored_w1
    - {root: rescored_root, trial_offset: 0}
    - {root: rescored_v3, trial_offset: 3, overrides: false}

protocols:
  # same-hardware baselines for F5 / R_F5 (W1): run on Kaggle, 10 fresh trials. Not decision protocols.
  D_KAGGLE: {folder: D_KAGGLE, control_only: true,
             models: [granite30, granite31, granite32, llama3, llama31, mistral_v01, mistral_v02, mistral_v03,
                      qwen2, qwen25, qwen3]}
  R_KAGGLE: {folder: R_KAGGLE, control_only: true, models: [granite30, granite31, granite32, llama3, llama31]}
  # W2: second A/A arm (same run seed, trial seeds 5678-5687), under D and R.
  D_AA2: {folder: D_AA2, control_only: true}
  R_AA2: {folder: R_AA2, control_only: true}
  # W3 (conditional): full task sets for D and R. Parts: original tasks (W1 records) + added tasks (separate runs).
  D_W3: {folder: D, control_only: true}
  R_W3: {folder: R, control_only: true, confounded_models: {qwen3: grammar+thinking_blocked}}
  # F10 in Phase 2 is D's greedy trial, taken from the D records (no files).
  F10: {folder: F10}
  # Phase 1 control records alone (3 trials): only for the descriptive secondary-gate table.
  R_P1: {folder: R, control_only: true}
  R_AA_P1: {folder: R_AA, control_only: true}
  R_PC_Q2K_P1: {folder: R_PC_Q2K, control_only: true}
  R_PC_NODESC_P1: {folder: R_PC_NODESC, control_only: true}

phase2:
  mode: phase2
  roots:
    v3: ../results_v3
    rescored_v3: ../rescored_v3
  n_trials: 10
  seed_base: 1234               # main trial seeds 1234-1243
  phase1_reference: ../analysis_out/factor_flips_long.csv     # frozen Phase 1 flip table (P2, P6, new flips)
  decision_protocols: [D, R, F1, F2, F3, F4_json, F5, F6, F7, F8, F10]

  model_sets:
    # the 11 models whose F5 ran on Kaggle in Phase 1 (D baselines on Kaggle) and the 5 whose R_F5 did
    kaggle_d: [granite30, granite31, granite32, llama3, llama31, mistral_v01, mistral_v02, mistral_v03,
               qwen2, qwen25, qwen3]
    kaggle_r: [granite30, granite31, granite32, llama3, llama31]
    # the 10 models whose F6 sampling equals D's (W1: F6 is not re-run, D records are used)
    f6_equals_d: [mistral_v01, mistral_v02, mistral_v03, phi3_mini, phi35_mini, phi4_mini,
                  granite30, granite31, granite32, gemma2_2b]

  default_parts:                # anything not listed below: Phase 1 records only (e.g. R_F5, positive controls)
    - {root: auto}

  protocols:
    D: {parts: *laptop_w1}
    R: {parts: *laptop_w1}
    F1: {parts: *laptop_w1}
    F2: {parts: *laptop_w1}
    F3: {parts: *laptop_w1}
    F4_json: {parts: *laptop_w1}
    F6: {parts: *laptop_w1}
    F5:
      parts:
        # Kaggle models: all 10 trials run fresh on Kaggle. If W0 Part C allows reuse of Phase 1's Kaggle trials,
        # replace this first entry by the two laptop-style parts (results_root offset 0 + v3 offset 3).
        - {root: v3, trial_offset: 0, overrides: false, models: kaggle_d}
        - {root: results_root, trial_offset: 0, exclude_models: kaggle_d}
        - {root: v3, trial_offset: 3, overrides: false, exclude_models: kaggle_d}
    F7: {parts: *rescored_w1}
    F8: {parts: *rescored_w1}
    D_KAGGLE: {parts: [{root: v3, trial_offset: 0, overrides: false}]}
    R_KAGGLE: {parts: [{root: v3, trial_offset: 0, overrides: false}]}
    D_AA2: {parts: [{root: v3, trial_offset: 0, overrides: false}], seed_base: 5678}
    R_AA2: {parts: [{root: v3, trial_offset: 0, overrides: false}], seed_base: 5678}
    D_W3:
      parts:
        - {root: results_root, folder: D, trial_offset: 0}
        - {root: v3, folder: D, trial_offset: 3, overrides: false}
        - {root: v3, folder: W3_D, trial_offset: 0, overrides: false}
    R_W3:
      parts:
        - {root: results_root, folder: R, trial_offset: 0}
        - {root: v3, folder: R, trial_offset: 3, overrides: false}
        - {root: v3, folder: W3_R, trial_offset: 0, overrides: false}
    F10: {view_of: D, trials: greedy}
    # W2b: positive controls at 10 trials on the laptop: Phase 1 trials 1-3 (results_v2) + new trials 4-10
    # (results_v3, trial seeds 1237-1243), compared against the W1 laptop R runs. Same model scope as Phase 1.
    R_PC_Q2K: {parts: *laptop_w1}
    R_PC_NODESC: {parts: *laptop_w1}
    # Phase 1 only (3 trials); comparisons against 10-trial runs use the trials they share.
    R_F5: {n_trials: 3}
    R_P1: {parts: [{root: results_root, folder: R}], n_trials: 3}
    R_AA_P1: {parts: [{root: results_root, folder: R_AA}], n_trials: 3, seed_base: 5678}
    R_PC_Q2K_P1: {parts: [{root: results_root, folder: R_PC_Q2K}], n_trials: 3}
    R_PC_NODESC_P1: {parts: [{root: results_root, folder: R_PC_NODESC}], n_trials: 3}

  f6_trim: {protocol: F6, base: D, models: f6_equals_d}

  same_hardware:                # section 5: compare a factor run with a baseline on the same hardware
    F5: {baseline: D_KAGGLE, models: kaggle_d}
    R_F5: {baseline: R_KAGGLE, models: kaggle_r}

  hypotheses:
    p1_threshold: 0.20
    p2_min_replicated: 7
    p3_max: 0.05
    p4_min: 0.90
    p6_min_replicated: 4
  # Descriptive (PLAN_PHASE2.md W4): the secondary gate on Phase 1's own control records, no new runs.
  descriptive_controls:
    - {name: P1_AA_R, kind: aa, protocol_a: R_P1, protocol_b: R_AA_P1, gate: ci,
       models: [mistral_v02, qwen2, qwen25, llama31, phi35_mini, granite31]}
    - {name: P1_PC_Q2K_R, kind: pc, protocol_a: R_P1, protocol_b: R_PC_Q2K_P1, gate: ci,
       models: [mistral_v03, qwen25, llama31, granite32]}
    - {name: P1_PC_NODESC_R, kind: pc, protocol_a: R_P1, protocol_b: R_PC_NODESC_P1, gate: ci,
       models: [mistral_v03, qwen25, llama31, granite32]}
  p3_control: AA2_R
  p4_control: PC_Q2K_R          # W2b, 10 trials
  p5_control: PC_NODESC_R       # W2b, 10 trials
  f5_aa_control: AA2_D          # the A/A used as noise bound for F5 shifts (F5 is a D-protocol factor)
  p6_factor: F5

  w3:
    protocols:
      D: {protocol: D_W3, gate: point}
      R: {protocol: R_W3, gate: ci}
    suites: [bfcl_simple, bfcl_multiple]      # synthetic is not extended in W3
    original_tasks:
      bfcl_simple: ../data/bfcl_tasks.jsonl
      bfcl_multiple: ../data/bfcl_multiple_tasks.jsonl

  # Descriptive: for these suites every decision is also reported with a cluster bootstrap in which tasks that share
  # the same baseline prompt form one cluster (the synthetic generator repeats prompts: 54 distinct in 100 tasks).
  cluster_bootstrap:
    suites: [synthetic]

controls:
  - {name: AA2_R, kind: aa2, protocol_a: R, protocol_b: R_AA2, gate: ci,
     models: [mistral_v01, mistral_v02, mistral_v03, qwen2, qwen25, qwen3, llama3, llama31, phi3_mini, phi35_mini,
              phi4_mini, granite30, granite31, granite32, gemma2_2b, gemma3_4b]}
  - {name: AA2_D, kind: aa2, protocol_a: D, protocol_b: D_AA2, gate: point,
     models: [mistral_v01, mistral_v02, mistral_v03, qwen2, qwen25, qwen3, llama3, llama31, phi3_mini, phi35_mini,
              phi4_mini, granite30, granite31, granite32, gemma2_2b, gemma3_4b]}
  - {name: PC_Q2K_R, kind: pc, protocol_a: R, protocol_b: R_PC_Q2K, gate: ci, models: [mistral_v03, qwen25, llama31, granite32]}
  - {name: PC_NODESC_R, kind: pc, protocol_a: R, protocol_b: R_PC_NODESC, gate: ci, models: [mistral_v03, qwen25, llama31, granite32]}
